; Test cases for the Prompt Lab (developer mode, see config.ini).
; Every prompt technique (1 to 5) gets the same test case, so only the prompt changes.
; The Prompt Lab reads this file every time the page reloads: edit, add or remove cases freely.
;
; One section per test case. The section name in [brackets] is the name shown in the Prompt Lab.
;   role             required. Must be one of the app's roles (exactly as written):
;                    Frontend Developer, Backend Developer, Full-Stack Developer,
;                    DevOps / SRE, Data / AI Engineer, QA Engineer
;   level            required. One of: Junior, Mid, Senior, Lead
;   note             optional. What this case is meant to test.
;   expected_topics  optional. Topics good questions should cover, separated by commas.
;
; A case with a wrong role or level is skipped, and the Prompt Lab shows why.

[Junior QA Engineer]
role = QA Engineer
level = Junior
note = Entry level: questions should check fundamentals and willingness to learn, not system design.
expected_topics = test cases, bug reports, manual vs. automated testing, test automation basics, teamwork

[Mid Full-Stack Developer]
role = Full-Stack Developer
level = Mid
note = Two technical areas: frontend and backend should both appear.
expected_topics = REST APIs, frontend framework, databases, debugging, working independently

[Senior Backend Developer]
role = Backend Developer
level = Senior
note = The standard case: system design, trade-offs and mentoring.
expected_topics = system design, databases, scaling, reliability, mentoring

[Lead DevOps / SRE]
role = DevOps / SRE
level = Lead
note = Leadership level: strategy and people, not only tools.
expected_topics = SLOs and reliability, incident management, CI/CD strategy, cloud costs, team leadership

[Mid Data / AI Engineer]
role = Data / AI Engineer
level = Mid
note = A field where questions easily get too generic ("what is machine learning?").
expected_topics = data pipelines, SQL, model training, model deployment, data quality
